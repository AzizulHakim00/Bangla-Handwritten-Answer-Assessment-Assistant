spring.application.name=answer-assessment
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/answer_assessment}
server.port=${PORT:8080}
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=200MB
server.error.include-message=always
server.error.include-stacktrace=never
server.forward-headers-strategy=${ASSESSMENT_FORWARD_HEADERS:none}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${ASSESSMENT_SECURE_COOKIES:false}
server.servlet.session.cookie.same-site=lax
assessment.storage=${SCRIPT_STORAGE:./data/scripts}
assessment.partitioned=${ASSESSMENT_PARTITIONED:false}
